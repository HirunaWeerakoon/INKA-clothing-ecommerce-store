# ============================================================
# Nginx config for INKA Frontend container
# ============================================================
# What this file does:
#   - Serves React static files from /usr/share/nginx/html
#   - Proxies any request starting with /api to the backend
#     container (named "backend" in docker-compose / K8s service)
#   - Handles React Router (BrowserRouter) by returning index.html
#     for any unknown path (so page refresh doesn't 404)
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Root: serve React static build output
    root /usr/share/nginx/html;
    index index.html;

    # API reverse proxy — forwards /api/* to the backend service
    # In docker-compose, backend hostname is "backend"
    # In Kubernetes, it will be the backend Service name
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # OAuth2 redirect also goes to backend
    location /login/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # React Router support: unknown paths return index.html
    # so that reloading /product/5 works instead of 404-ing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively (JS/CSS have content-hashed filenames)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Disable access log for health checks to reduce noise
    location /health {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
