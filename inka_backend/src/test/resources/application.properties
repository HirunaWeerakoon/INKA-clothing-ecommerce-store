spring.application.name=inka_backend_test

# In-Memory H2 Database for unit tests (zero external database dependency in CI)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Mock / Dummy credentials for unit tests
spring.security.oauth2.client.registration.google.client-id=dummy-test-id
spring.security.oauth2.client.registration.google.client-secret=dummy-test-secret
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

cloudinary.cloud-name=dummy-cloud
cloudinary.api-key=dummy-key
cloudinary.api-secret=dummy-secret

stripe.secret-key=dummy-stripe-key
stripe.webhook-secret=dummy-stripe-webhook
stripe.success-url=http://localhost:3000/checkout/success
stripe.cancel-url=http://localhost:3000/checkout/cancel
